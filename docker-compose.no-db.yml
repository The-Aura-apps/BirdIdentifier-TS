version: '3.8'

# Docker Compose for servers with existing PostgreSQL
# Use this if you already have PostgreSQL running on port 5432

services:
  # BirdNET Service
  birdnet:
    build:
      context: ./birdnet-service
      dockerfile: Dockerfile
    container_name: birdnet-service
    restart: unless-stopped
    # No host port published: only the `app` container talks to this,
    # over the internal bird-network at http://birdnet:8080.
    networks:
      - bird-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NestJS Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bird-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Use host.docker.internal to connect to PostgreSQL on host machine
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@host.docker.internal:5432/${DB_NAME}
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: 3000
      BIRDNET_URL: http://birdnet:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NODE_ENV: production
    depends_on:
      - birdnet
    networks:
      - bird-network
    volumes:
      - ./uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  bird-network:
    driver: bridge
