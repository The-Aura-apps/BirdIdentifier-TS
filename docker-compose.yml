services:
  # Your existing NestJS application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bird-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - BIRDNET_URL=http://birdnet:8080
    depends_on:
      - birdnet
      - db
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads
    networks:
      - bird-network

  # BirdNET Audio Analysis Service
  birdnet:
    build:
      context: .
      dockerfile: Dockerfile.birdnet
    container_name: birdnet-analyzer
    ports:
      - "8080:8080"
    volumes:
      - ./birdnet-uploads:/app/uploads
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - bird-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Your database (adjust as needed)
  db:
    image: postgres:15-alpine
    container_name: bird-db
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bird-network

networks:
  bird-network:
    driver: bridge

volumes:
  postgres-data: