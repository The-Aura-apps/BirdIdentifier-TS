version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: bird-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # No host port published: `app` only ever reaches this over the internal
    # bird-network at db:5432. Windows' Hyper-V port-exclusion ranges shift
    # over time and kept colliding with whatever host port was mapped here.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bird-network

  # BirdNET Standalone Service (Mock Data)
  birdnet:
    build:
      context: ./birdnet-service
      dockerfile: Dockerfile
    container_name: birdnet-service
    restart: unless-stopped
    # No host port published: only the `app` container talks to this,
    # over the internal bird-network at http://birdnet:8080.
    networks:
      - bird-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NestJS Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bird-api
    restart: unless-stopped
    ports:
      # Server default: bind to localhost only so nginx (same box) can reach it
      # and ufw isn't bypassed. Override APP_PORT in .env for local dev.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    # Everything the app reads (OPENAI_API_KEY, DB_*, PEXELS/XENOCANTO keys,
    # CDN_URL, LOCAL_STORAGE_URL, APNS_*, ...) comes from .env via env_file.
    env_file: .env
    # These pin the container-networking values so they win over whatever the
    # same .env uses for local dev (e.g. DB_HOST=localhost, PORT=4000).
    environment:
      DB_HOST: db
      DB_PORT: 5432
      BIRDNET_URL: http://birdnet:8080
      PORT: 3000
      NODE_ENV: production
    depends_on:
      - db
      - birdnet
    networks:
      - bird-network
    volumes:
      - ./uploads:/app/uploads

networks:
  bird-network:
    driver: bridge

volumes:
  postgres_data:
