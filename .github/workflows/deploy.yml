name: CD - Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/bird-identifier
            git pull origin main
            docker compose up -d --build
            # migrations run inside the already-built app container, using
            # the compiled runner (no ts-node/devDeps dependency the way
            # `npm run migration:run` would need)
            docker compose exec -T app node dist/migrate.js || true
            echo "Deployment completed successfully!"
