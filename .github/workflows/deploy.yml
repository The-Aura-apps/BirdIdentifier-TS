name: CD - Deploy to Production Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Build application
      run: npm run build

    - name: Deploy to server with Docker
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e

          echo "🚀 Starting deployment..."

          # Navigate to app directory
          cd /var/www/bird-identifier/BirdIdentifier-Backend
          
          # Fetch latest from remote
          echo "📥 Fetching latest code..."
          git fetch origin
          
          # Clean untracked files
          git clean -fd
          
          # Reset hard to match origin/main
          git reset --hard origin/main
          
          # Pull latest changes
          git pull origin main
          
          # Install dependencies (needed for migrations and any server-side scripts)
          echo "📦 Installing dependencies..."
          npm ci
          
          # Build application (to verify it compiles before Docker build)
          echo "🔨 Building application..."
          npm run build
          
          # Check if Docker is available
          if ! command -v docker &> /dev/null; then
              echo "❌ Docker not found! Please install Docker first."
              echo "See SERVER-SETUP.md for installation instructions."
              exit 1
          fi
          
          # Check if .env exists
          if [ ! -f .env ]; then
              echo "⚠️  .env file not found! Creating from .env.production..."
              cp .env.production .env
              echo "🔧 Please update .env with your credentials!"
          fi
          
          # Stop old PM2 processes if running (to avoid port conflicts)
          if command -v pm2 &> /dev/null; then
              echo "🛑 Stopping old PM2 processes..."
              pm2 delete all || true
              pm2 save || true
          fi
          
          echo "🐳 Building Docker containers..."
          docker compose build
          
          echo "🔄 Restarting services..."
          docker compose up -d
          
          echo "⏳ Waiting for services to be ready..."
          sleep 10
          
          # Check container status
          echo "📊 Container status:"
          docker compose ps
          
          # Run database migrations
          echo "🗄️  Running database migrations..."
          docker compose exec -T app npm run migration:run || true
          
          # Health check
          echo "🏥 Health check..."
          
          # Check BirdNET
          if curl -f http://localhost:8080/health > /dev/null 2>&1; then
              echo "✅ BirdNET is healthy"
          else
              echo "⚠️  BirdNET health check failed"
          fi
          
          # Check NestJS API
          if curl -f http://localhost:3000/health > /dev/null 2>&1; then
              echo "✅ NestJS API is healthy"
          else
              echo "⚠️  NestJS API health check failed"
          fi
          
          echo "✨ Deployment completed successfully!"
          echo "📝 View logs with: docker compose logs -f"

    - name: Notify deployment status
      if: always()
      run: |
        if [ ${{ job.status }} == 'success' ]; then
          echo "✅ Deployment successful!"
        else
          echo "❌ Deployment failed!"
        fi