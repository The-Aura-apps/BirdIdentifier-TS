name: CD - Deploy to 46.249.101.76 server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests (optional)
      run: npm test || true

    - name: Build application
      run: npm run build

    - name: Deploy to server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e

          # Navigate to app directory
          cd /var/www/bird-identifier/BirdIdentifier-Backend
          
          # Fetch latest from remote
          git fetch origin
          
          # Clean untracked files (add -n for dry run if testing; remove if you don't want to delete untracked)
          git clean -fd
          
          # Reset hard to match origin/main (discards local modifications)
          git reset --hard origin/main
          
          # Now pull (should be clean)
          git pull origin main
          
          # Install dependencies
          npm ci
          
          # Build application
          npm run build
          
          # Run database migrations
          npm run migration:run || true
          
          # Restart application with PM2
          pm2 reload ecosystem.config.js --update-env
          
          # Save PM2 process list
          pm2 save
          
          echo "Deployment completed successfully!"

    - name: Notify deployment status
      if: always()
      run: |
        if [ ${{ job.status }} == 'success' ]; then
          echo "✅ Deployment successful!"
        else
          echo "❌ Deployment failed!"
        fi