name: CI/CD - Build, Test, and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests (skip if none exist)
      run: npm test -- --passWithNoTests

    - name: Run E2E tests
      run: npm run test:e2e || echo "E2E tests failed or not configured"

    - name: Build application
      run: npm run build

    - name: Lint code (if configured)
      run: npm run lint || true

  deploy:
    needs: build
    # Only deploy on an actual push to main (or a manual trigger) — never for
    # pull_request runs, which build/test a branch that isn't merged yet.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/bird-identifier
            git pull origin main
            docker compose up -d --build
            # migrations run inside the already-built app container, using
            # the compiled runner (no ts-node/devDeps dependency the way
            # `npm run migration:run` would need)
            docker compose exec -T app node dist/migrate.js || true
            echo "Deployment completed successfully!"
