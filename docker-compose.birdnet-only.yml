# Docker Compose - Only BirdNET service
# NestJS runs via PM2, PostgreSQL on server

services:
  # BirdNET Service ONLY
  birdnet:
    build:
      context: ./birdnet-service
      dockerfile: Dockerfile
    container_name: birdnet-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
